services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
      POSTGRES_DB: credit_scoring
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
